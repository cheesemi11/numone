<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양시 약국 검색 지도</title>
    
    <!-- 카카오맵 API (Services 라이브러리 포함) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=aaa8e4a09a8583714b45fa5ebf4aab04&libraries=services"></script>
    
    <style>
        /* 눈누 웹폰트: 고운 다움 */
        @font-face {
            font-family: 'GowunDaum';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2205@1.0/GowunDaum-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'GowunDaum', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f8ff;
        }

        /* 전체 레이아웃 (연파랑 테마) */
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 사이드바 */
        #sidebar {
            width: 380px;
            height: 100%;
            background: rgba(235, 245, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 4px 0 15px rgba(180, 210, 240, 0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* 타이틀 디자인 (버블 컨셉) */
        .title {
            color: #4a7c59;
            color: #3b7ea1;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .title-bubble {
            display: inline-block;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #a1c4fd);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(161, 196, 253, 0.6);
        }

        /* 검색 영역 (버블 스타일) */
        .search-box {
            display: flex;
            background: #ffffff;
            border-radius: 30px;
            padding: 6px 12px;
            box-shadow: 0 4px 12px rgba(173, 216, 230, 0.4);
            border: 2px solid #c2e9fb;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 8px 12px;
            font-size: 1rem;
            border-radius: 20px;
            color: #4a6fa5;
        }

        .search-box button {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            border: none;
            color: white;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .search-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(161, 196, 253, 0.6);
        }

        /* 검색 결과 리스트 */
        #placesList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding-right: 5px;
        }

        /* 스크롤바 연파랑 스타일링 */
        #placesList::-webkit-scrollbar {
            width: 6px;
        }
        #placesList::-webkit-scrollbar-thumb {
            background-color: #b0d4f1;
            border-radius: 10px;
        }

        .item {
            background: #ffffff;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #e1f0ff;
            box-shadow: 0 2px 8px rgba(220, 235, 252, 0.5);
            position: relative;
        }

        .item:hover {
            transform: translateY(-2px);
            background: #f4f9ff;
            border-color: #a1c4fd;
            box-shadow: 0 4px 12px rgba(161, 196, 253, 0.4);
        }

        .item h5 {
            color: #2c5282;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .item .address {
            font-size: 0.85rem;
            color: #6b7c93;
            margin-bottom: 4px;
        }

        .item .tel {
            font-size: 0.8rem;
            color: #8fa3bf;
        }

        /* 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 버블 인포윈도우 커스텀 스타일 */
        .bubble-info {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            border: 2px solid #a1c4fd;
            box-shadow: 0 6px 15px rgba(161, 196, 253, 0.4);
            font-size: 0.9rem;
            color: #2c5282;
            text-align: center;
            font-weight: bold;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- 왼쪽 사이드바 -->
    <div id="sidebar">
        <div class="title">
            <span class="title-bubble"></span>
            고양시 약국 검색
            <span class="title-bubble"></span>
        </div>
        
        <div class="search-box">
            <input type="text" id="keyword" placeholder="약국 이름을 입력하세요..." onkeyup="if(window.event.keyCode==13){searchPlaces()}">
            <button onclick="searchPlaces()">검색</button>
        </div>

        <ul id="placesList"></ul>
    </div>

    <!-- 카카오 지도 -->
    <div id="map"></div>
</div>

<script>
    // 1. 지도 생성 (고양시청 기준)
    const mapContainer = document.getElementById('map');
    const mapOptions = {
        center: new kakao.maps.LatLng(37.6584, 126.8320), // 고양시 중심 좌표
        level: 5
    };
    const map = new kakao.maps.Map(mapContainer, mapOptions);

    // 장소 검색 객체 생성
    const ps = new kakao.maps.services.Places();
    
    // 마커 및 오버레이 관리 배열
    let markers = [];
    let customOverlays = [];

    // 비눗방울(버블) 모양의 커스텀 SVG 마커 아이콘
    const bubbleIconSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="16" fill="rgba(161, 196, 253, 0.6)" stroke="#ffffff" stroke-width="2"/>
            <circle cx="20" cy="20" r="14" fill="url(#grad)" opacity="0.8"/>
            <circle cx="14" cy="14" r="4" fill="#ffffff" opacity="0.7"/>
            <defs>
                <radialGradient id="grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#c2e9fb"/>
                    <stop offset="100%" stop-color="#a1c4fd"/>
                </radialGradient>
            </defs>
        </svg>
    `;
    
    const markerImageSrc = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(bubbleIconSvg);
    const imageSize = new kakao.maps.Size(38, 38);
    const markerImage = new kakao.maps.MarkerImage(markerImageSrc, imageSize);

    // 초기 검색 실행 (고양시 전체 약국)
    searchPlaces();

    // 키워드 검색 함수
    function searchPlaces() {
        const keywordInput = document.getElementById('keyword').value.trim();
        
        // 검색어 조합 (고양시 + 입력어 + 약국)
        let searchKeyword = '고양시 ';
        if (keywordInput) {
            searchKeyword += keywordInput + ' 약국';
        } else {
            searchKeyword += '약국';
        }

        // 카카오 장소 검색 API 호출
        ps.keywordSearch(searchKeyword, placesSearchCB);
    }

    // 장소 검색 완료 시 콜백 함수
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 존재하지 않습니다.');
            clearMap();
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('검색 결과 중 오류가 발생했습니다.');
        }
    }

    // 검색 결과 목록 및 마커 표시
    function displayPlaces(places) {
        const listEl = document.getElementById('placesList');
        const bounds = new kakao.maps.LatLngBounds();

        // 기존 마커 및 목록 제거
        clearMap();
        listEl.innerHTML = '';

        for (let i = 0; i < places.length; i++) {
            const place = places[i];
            const placePosition = new kakao.maps.LatLng(place.y, place.x);

            // 마커 생성
            const marker = new kakao.maps.Marker({
                position: placePosition,
                image: markerImage,
                map: map
            });

            // 오버레이(비눗방울 텍스트 창) 생성
            const customOverlay = new kakao.maps.CustomOverlay({
                position: placePosition,
                content: `<div class="bubble-info">💊 ${place.place_name}</div>`,
                yAnchor: 2.2
            });

            // 마커 클릭 시 오버레이 토글 및 이동
            kakao.maps.event.addListener(marker, 'click', function() {
                closeAllOverlays();
                customOverlay.setMap(map);
                map.panTo(placePosition);
            });

            // 목록 항목 생성
            const itemEl = document.createElement('li');
            itemEl.className = 'item';
            itemEl.innerHTML = `
                <h5>${place.place_name}</h5>
                <div class="address">${place.road_address_name || place.address_name}</div>
                <div class="tel">${place.phone || '전화번호 없음'}</div>
            `;

            // 목록 항목 클릭 이벤트
            itemEl.onclick = function() {
                closeAllOverlays();
                customOverlay.setMap(map);
                map.setLevel(3);
                map.panTo(placePosition);
            };

            listEl.appendChild(itemEl);
            bounds.extend(placePosition);

            markers.push(marker);
            customOverlays.push(customOverlay);
        }

        // 검색된 모든 마커가 보이도록 지도 범위를 재설정
        if (places.length > 0) {
            map.setBounds(bounds);
        }
    }

    // 기존 지도 요소 삭제
    function clearMap() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        closeAllOverlays();
        markers = [];
        customOverlays = [];
    }

    // 모든 오버레이 닫기
    function closeAllOverlays() {
        for (let i = 0; i < customOverlays.length; i++) {
            customOverlays[i].setMap(null);
        }
    }
</script>

</body>
</html>
