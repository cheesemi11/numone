<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* 1. 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 2. 전체 화면 2분할 레이아웃 (Flexbox 사용) */
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 3. 왼쪽 사이드바 (검색창 + 리스트) */
        #sidebar {
            width: 380px;
            height: 100%;
            background-color: #ffffff;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
        }

        /* 검색 영역 헤더 */
        .search-header {
            padding: 20px;
            background-color: #fae100; /* 카카오 시그니처 노란색 */
            border-bottom: 1px solid #e6ce00;
        }

        .search-header h1 {
            font-size: 20px;
            color: #3c1e1e;
            margin-bottom: 12px;
        }

        /* 검색 폼 스타일 */
        .search-form {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .search-input:focus {
            border-color: #333;
        }

        .search-btn {
            padding: 10px 16px;
            background-color: #3c1e1e;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #552b2b;
        }

        /* 장소 목록 리스트 영역 */
        #places-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        /* 개별 장소 리스트 아이템 */
        .place-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .place-item:hover {
            background-color: #f8f9fa;
        }

        .place-name {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            margin-bottom: 4px;
        }

        .place-address {
            font-size: 13px;
            color: #666;
            margin-bottom: 2px;
        }

        .place-phone {
            font-size: 12px;
            color: #2b8a3e;
        }

        /* 4. 오른쪽 지도 영역 (나머지 공간을 전부 채움) */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 지도 위 인포윈도우(말풍선) 커스텀 스타일 */
        .info-window {
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- 화면 구조: 왼쪽(사이드바) + 오른쪽(지도) -->
    <div id="container">
        <!-- 왼쪽: 검색 및 결과 리스트 -->
        <div id="sidebar">
            <div class="search-header">
                <h1>📍 카카오맵 장소 검색</h1>
                <form id="search-form" class="search-form" onsubmit="return false;">
                    <input type="text" id="keyword-input" class="search-input" placeholder="장소를 입력하세요 (예: 강남역 맛집)" value="카페">
                    <button type="submit" id="search-btn" class="search-btn">검색</button>
                </form>
            </div>
            <!-- 검색 결과가 출력될 리스트 -->
            <ul id="places-list"></ul>
        </div>

        <!-- 오른쪽: 지도 표시 영역 -->
        <div id="map"></div>
    </div>

    <!-- 카카오맵 JavaScript SDK 로드 (autoload=false를 사용하여 스크립트 로드 완료 후 실행되게 함) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=aaa8e4a09a8583714b45fa5ebf4aab04&libraries=services&autoload=false"></script>

    <script>
        // 전역 변수 선언
        let map; // 지도 객체
        let placesService; // 카카오 장소 검색 서비스 객체
        let infoWindow; // 클릭 시 장소명을 보여줄 인포윈도우(말풍선)
        let markers = []; // 생성된 마커들을 관리할 배열

        // [중요] 카카오맵 API 스크립트가 완전히 로드된 후 안전하게 실행 (로딩 오류 방지)
        kakao.maps.load(function() {
            initMap();
        });

        // 지도 초기화 함수
        function initMap() {
            const mapContainer = document.getElementById('map'); // 지도를 표시할 HTML 엘리먼트
            
            // 초기 지도 설정 (기본 위치: 서울시청, 확대 레벨: 5)
            const mapOptions = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567),
                level: 5 // 지도 확대 레벨 5로 설정
            };

            // 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);

            // 장소 검색 라이브러리 및 인포윈도우 객체 생성
            placesService = new kakao.maps.services.Places();
            infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 1. 페이지 오픈 시 사용자 현재 위치 받아오기 실행
            getUserLocation();

            // 2. 검색 폼 이벤트 연결 (엔터키 또는 버튼 클릭 시)
            const searchForm = document.getElementById('search-form');
            searchForm.addEventListener('submit', function() {
                searchPlaces();
            });
        }

        // 사용자의 현재 위치 권한을 확인하고 지도를 중심 이동하는 함수
        function getUserLocation() {
            if (navigator.geolocation) {
                // 브라우저의 Geolocation API로 현재 위도/경도 조회
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const latitude = position.coords.latitude; // 위도
                        const longitude = position.coords.longitude; // 경도
                        
                        const currentPosition = new kakao.maps.LatLng(latitude, longitude);

                        // 지도의 중심을 현재 위치로 이동
                        map.setCenter(currentPosition);

                        // 현재 위치 표시용 마커 생성
                        const currentMarker = new kakao.maps.Marker({
                            position: currentPosition,
                            map: map
                        });

                        // 현재 위치 안내 인포윈도우 표시
                        const currentInfoWindow = new kakao.maps.InfoWindow({
                            content: '<div class="info-window">📍 현재 위치</div>'
                        });
                        currentInfoWindow.open(map, currentMarker);

                        // 현재 위치 설정 후 기본 검색 실행
                        searchPlaces();
                    },
                    function(error) {
                        console.warn('위치 권한을 허용하지 않했거나 위치를 가져올 수 없어 기본 위치에서 진행합니다.', error);
                        searchPlaces();
                    }
                );
            } else {
                alert('이 브라우저는 위치 서비스(Geolocation)를 지원하지 않습니다.');
                searchPlaces();
            }
        }

        // 장소 검색 요청 함수
        function searchPlaces() {
            const keywordInput = document.getElementById('keyword-input');
            const keyword = keywordInput.value.trim();

            if (!keyword) {
                alert('검색어를 입력해주세요!');
                return;
            }

            // 카카오 키워드 검색 서비스 실행
            placesService.keywordSearch(keyword, placesSearchCallback);
        }

        // 카카오 장소 검색 응답 콜백 함수
        function placesSearchCallback(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                // 정상적으로 검색되었을 때
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
                clearPlacesList();
                removeMarkers();
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 도중 오류가 발생했습니다.');
            }
        }

        // 검색된 장소 목록과 마커를 화면에 출력하는 함수
        function displayPlaces(places) {
            const listElement = document.getElementById('places-list');
            const bounds = new kakao.maps.LatLngBounds(); // 지도 범위를 재설정하기 위한 객체

            // 이전 검색 결과 리스트 및 마커 지우기
            clearPlacesList();
            removeMarkers();

            places.forEach((place, index) => {
                // 장소 위치 좌표 생성
                const placePosition = new kakao.maps.LatLng(place.y, place.x);

                // 지도에 마커 추가
                const marker = addMarker(placePosition);

                // 지도 전체 영역 계산을 위해 좌표 추가
                bounds.extend(placePosition);

                // 왼쪽 사이드바에 들어갈 리스트 항목 HTML 생성
                const listItem = createListItem(place, index);

                // 마커 및 리스트 클릭 이벤트 등록
                (function(marker, title) {
                    // 마커 클릭 시 정보창 표시
                    kakao.maps.event.addListener(marker, 'click', function() {
                        displayInfoWindow(marker, title);
                    });

                    // 리스트 항목 클릭 시 해당 위치로 지도 이동 및 정보창 표시
                    listItem.onclick = function() {
                        map.setCenter(placePosition);
                        displayInfoWindow(marker, title);
                    };
                })(marker, place.place_name);

                listElement.appendChild(listItem);
            });

            // 검색 결과 마커들이 모두 보이도록 지도 화면 범위 조정
            map.setBounds(bounds);
        }

        // 지도에 마커를 생성하는 함수
        function addMarker(position) {
            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });

            markers.push(marker); // 마커 지우기를 위해 배열에 저장
            return marker;
        }

        // 지도 위의 모든 마커를 지우는 함수
        function removeMarkers() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];
        }

        // 마커 클릭 시 나타나는 정보창(인포윈도우) 표시 함수
        function displayInfoWindow(marker, title) {
            const content = `<div class="info-window">${title}</div>`;
            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // 장소 목록의 개별 `<li>` 엘리먼트 생성 함수
        function createListItem(place, index) {
            const li = document.createElement('li');
            li.className = 'place-item';

            const addressName = place.road_address_name ? place.road_address_name : place.address_name;
            const phoneNumber = place.phone ? place.phone : '전화번호 없음';

            li.innerHTML = `
                <div class="place-name">${index + 1}. ${place.place_name}</div>
                <div class="place-address">${addressName}</div>
                <div class="place-phone">${phoneNumber}</div>
            `;

            return li;
        }

        // 사이드바의 장소 리스트를 완전히 비우는 함수
        function clearPlacesList() {
            const listElement = document.getElementById('places-list');
            listElement.innerHTML = '';
        }
    </script>
</body>
</html>
